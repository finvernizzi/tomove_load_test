host = "edge.tomove.nextgcloud.com"
domain = "quandopasso"
api_version = "v2"
users = 750
interval_s = 180
random_delay_min_s = 0
random_delay_max_s = 5
duration_s = 600
warmup_s = 90
ramp_up_s = 240
summary_interval_s = 5
radius_m = 5000
random_seed = 42
failure_statuses = ["4xx", "5xx"]
client_max_connections = 700
client_max_keepalive_connections = 350
client_keepalive_expiry_s = 30
client_http2 = true
client_trust_env = true
max_in_flight_requests = 250

[request]
method = "GET"
url_template = "https://{{HOST}}/{{DOMAIN}}/mobile/{{API_VERSION}}/messages?domain={{DOMAIN}}&no_jws=true&lat={{RANDOM_LAT}}&lng={{RANDOM_LNG}}&radius={{RADIUS}}"
timeout_s = 20
total_timeout_s = 20
connect_timeout_s = 5
read_timeout_s = 20
write_timeout_s = 20
pool_timeout_s = 5

[request.headers]
Accept = "application/json"
User-Agent = "traffic-simulator/1.0"
X-Domain = "{{DOMAIN}}"

[geo]
area = "Turin"

[geo.named_areas.Turin]
min_lat = 45.0100
max_lat = 45.1200
min_lng = 7.5900
max_lng = 7.7600

[geo.named_areas.Milan]
min_lat = 45.4000
max_lat = 45.5300
min_lng = 9.0500
max_lng = 9.2900

[export]
json_path = "reports/latest_report.json"
csv_path = "reports/latest_report.csv"
